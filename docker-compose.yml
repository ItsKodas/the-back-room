# The game in one container, pointed at a database you already run.
#
#   docker compose up --build
#
# Then open http://localhost:3001 — in production the server serves the built
# client itself, so there is no separate web container and no CORS to arrange.
#
# Everything the container is configured with comes from .env — the port it
# publishes, where it sends people after they sign in, and the database. The
# defaults below apply only where .env is silent.
#
# MONGO_URL is the one worth reading twice:
#
#   * `localhost` inside a container means the container, not your machine.
#     To reach a mongod on this host, use host.docker.internal:27017.
#   * Leaving it unset is not an error. The game runs on an in-memory store:
#     profiles, chips and history vanish on restart, everything else works.
#
# To have this stack bring its own database instead, add the second file:
#
#   docker compose -f docker-compose.yml -f docker-compose.bundled-db.yml up --build

services:
  backroom:
    build: .
    restart: unless-stopped
    # Loopback by default, because the usual way to run this is behind something
    # that terminates TLS (see TRUST_PROXY): the proxy reaches the container on
    # localhost, and nothing else should. Publishing on every interface, which
    # is what an address-less mapping does, also puts the site on the LAN on a
    # plain port, reachable around the proxy and around whatever that proxy is
    # doing about TLS, sessions and access. Set BIND_ADDR=0.0.0.0 to ask for
    # that deliberately.
    ports:
      - "${BIND_ADDR:-127.0.0.1}:${PORT:-3001}:${PORT:-3001}"
    # Named one by one rather than handing the whole file over, so that
    # `--env-file` switches every one of them together. A service that both
    # interpolates from one file and env_file's another reads half its
    # configuration from each, which is a bad way to find out where a password
    # came from.
    environment:
      MONGO_URL: ${MONGO_URL:-}
      SESSION_SECRET: ${SESSION_SECRET:-}
      DISCORD_CLIENT_ID: ${DISCORD_CLIENT_ID:-}
      DISCORD_CLIENT_SECRET: ${DISCORD_CLIENT_SECRET:-}
      DISCORD_REDIRECT_URI: ${DISCORD_REDIRECT_URI:-}
      ADMIN_DISCORD_IDS: ${ADMIN_DISCORD_IDS:-}
      # Where a player's browser is, which is where they land after signing in.
      # Note this is NOT the dev value: `npm run dev` puts the client on Vite's
      # port and the API on another, while here the server serves the client
      # itself, so the two are one address.
      CLIENT_ORIGIN: ${CLIENT_ORIGIN:-http://localhost:3001}
      PORT: ${PORT:-3001}
      # Only needed when more than one proxy sits in front; production already
      # assumes one.
      TRUST_PROXY: ${TRUST_PROXY:-}
