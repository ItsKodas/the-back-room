<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!--
      The same chip at every size something will ask for it in, pressed from
      favicon.svg by scripts/make-icons.mjs. Outside the markers below, because
      the icon is the building's rather than any one address's.
    -->
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <meta name="apple-mobile-web-app-title" content="Back Room" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <!--
      Translucent so the room's own dark shows through the status bar rather
      than a white strip; global.css pads the page clear of it.
    -->
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <!--
      Everything between the markers is rewritten per address by the server,
      which is the only thing that knows whose table /6PMKG is. What is written
      here are the defaults: what a crawler sees if this build is ever served
      by something simpler, and what the dev server shows, since Vite hands
      this file straight over without asking anybody.
    -->
    <!--meta-->
    <title>The Back Room: Blackjack, Poker, Slots and Dice for Chips</title>
    <meta
      name="description"
      content="Blackjack, poker, slots and dice, played for chips and never for money. Free to play with friends or strangers, on a phone or a desk."
    />
    <meta property="og:site_name" content="The Back Room" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="The Back Room" />
    <meta
      property="og:description"
      content="A back room for cards and dice, played for chips and nothing else."
    />
    <meta property="og:image" content="/og/site.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="theme-color" content="#0d1015" />
    <!--/meta-->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!--
      Loaded without blocking the first paint.

      A stylesheet in the head stops the page being drawn until it arrives, and
      this one comes from somebody else's server — so on a bad connection the
      room stayed black for as long as fonts.googleapis.com took to answer,
      which is the one thing a player has no way to work around. `media="print"`
      makes it irrelevant to the screen until it has loaded, and the onload puts
      it back; every stack in tokens.css names a real fallback, so what shows in
      the meantime is the page in system fonts rather than nothing.
    -->
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Bevan&family=Dancing+Script:wght@700&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap"
      media="print"
      onload="this.media='all'"
    />
    <noscript>
      <link
        rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Bevan&family=Dancing+Script:wght@700&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap"
      />
    </noscript>
    <!--
      What the server writes into #root between the door markers, for a crawler
      that runs no script and for the moment before the bundle lands. React
      replaces it on mount, so these rules only ever style that moment.
    -->
    <style>
      .door {
        max-width: 42rem;
        margin: 0 auto;
        padding: 2.5rem 16px 4rem;
        color: var(--gr-color-ink, #dfe7f2);
        font-family: var(--gr-font-ui, system-ui, sans-serif);
        line-height: 1.6;
        overflow-wrap: anywhere;
      }
      .door h1 {
        margin: 0 0 1rem;
        font-family: var(--gr-font-display, Georgia, serif);
        font-size: clamp(2rem, 8vw, 3rem);
        font-weight: 400;
        line-height: 1.1;
        color: var(--gr-color-ink-lit, #f2f6fb);
      }
      .door h2 {
        margin: 2rem 0 0.5rem;
        font-size: 1.1rem;
        color: var(--gr-color-ink-lit, #f2f6fb);
      }
      .door h3 {
        margin: 1.25rem 0 0.25rem;
        font-size: 1rem;
        color: var(--gr-color-ink, #dfe7f2);
      }
      .door p,
      .door li {
        color: var(--gr-color-ink-dim, #8b97a8);
      }
      .door ul {
        padding-left: 1.25rem;
      }
      .door a {
        color: var(--gr-color-neon-hi, #7ba9ff);
      }
    </style>
  </head>
  <body>
    <div id="root"><!--door--><!--/door--></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
